<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · Swatch</title>
  <style>
    :root {
      --swatch-color-canvas: #f4f0e6;
      --swatch-color-ink: #1c1915;
      --swatch-color-muted: #3d3832;
      --swatch-color-accent: #7c2d24;
      --swatch-font-sans: "Avenir Next", "Segoe UI", sans-serif;
      --swatch-font-display: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    }
    body { margin: 0; min-height: 100vh; background: var(--swatch-color-canvas); color: var(--swatch-color-ink); font-family: var(--swatch-font-sans); }
    main { width: min(100% - 2rem, 40rem); margin: 0 auto; padding: 3rem 0; }
    h1 { font-family: var(--swatch-font-display); font-size: 2.25rem; font-weight: 500; }
    a { color: var(--swatch-color-accent); }
    p { color: var(--swatch-color-muted); }
    :focus-visible { outline: 2px solid var(--swatch-color-accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>That page isn't here.</p>
    <p><a href="/">Back to Swatch</a></p>
  </main>
</body>
</html>
