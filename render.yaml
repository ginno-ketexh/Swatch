# Render Blueprint. Applying this creates a free web service and a free
# Postgres database, and deploys whenever `main` changes.
#
# preDeployCommand is intentionally omitted. Render only runs that command
# on paid compute plans. On the free plan, migrations run at the end of
# bin/render-build.sh. See docs/DEPLOY_RENDER.md.

databases:
  - name: swatch-db
    plan: free
    databaseName: swatch
    user: swatch

services:
  - type: web
    name: swatch
    runtime: ruby
    plan: free
    region: oregon
    branch: main
    # Deploy on every push to main. Equivalent to autoDeploy: true.
    autoDeployTrigger: commit
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec rails server
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swatch-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        sync: false
      # Only used to create the first owner. Remove both after the first sign-in.
      # Render ignores new sync: false keys on a Blueprint that already exists,
      # so add OWNER_EMAIL by hand in the dashboard before merging.
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
