# Render Blueprint. Applying this creates a free web service and a free
# Postgres database, and deploys whenever `main` changes.
#
# preDeployCommand is intentionally omitted. Render only runs that command
# on paid compute plans. On the free plan, migrations run at the end of
# bin/render-build.sh. See docs/DEPLOY_RENDER.md.

databases:
  # swatch-db is no longer used by the app (see DATABASE_URL below). It stays here
  # as a fallback until the move to Neon is confirmed, then it can be removed.
  - name: swatch-db
    plan: free
    databaseName: swatch
    user: swatch

services:
  - type: web
    name: swatch
    runtime: ruby
    plan: free
    region: oregon
    branch: main
    # Deploy on every push to main. Equivalent to autoDeploy: true.
    autoDeployTrigger: commit
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec rails server
    healthCheckPath: /up
    envVars:
      # DATABASE_URL now points at the Neon database (moved in DB-3), not swatch-db.
      # The value is set by hand on the Render service (Environment tab), never in this file.
      # Blueprint syncs leave sync: false keys alone, so they won't reset it to swatch-db.
      # To roll back, paste swatch-db's Internal Database URL back into DATABASE_URL.
      - key: DATABASE_URL
        sync: false
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        sync: false
      # The owner account already exists. The build does not read
      # OWNER_EMAIL, OWNER_PASSWORD, or OWNER_USERNAME.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      # Image storage. Add these four by hand on the Render service.
      # A Blueprint that already exists ignores new sync: false keys in this file.
      # - key: R2_ACCOUNT_ID
      #   sync: false
      # - key: R2_ACCESS_KEY_ID
      #   sync: false
      # - key: R2_SECRET_ACCESS_KEY
      #   sync: false
      # - key: R2_BUCKET
      #   sync: false
